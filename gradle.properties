org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Single source of truth for the user-facing "1.N" version:
# N = versionCode - versionNameOffset (clamped at 0). Set once, right before
# the first main release, so that release comes out as v1.0 -- afterwards it
# must never change or N would jump or regress. Both CI workflows read it
# from here; see README "Versioning".
versionNameOffset=70
