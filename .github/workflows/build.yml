name: Build APK

on:
  push:
    branches: [main, test]
  pull_request:
    branches: [main, test]
  workflow_dispatch:

permissions:
  contents: write

env:
  # Single source of truth for the user-facing "1.N" version:
  # N = github.run_number - VERSION_NAME_OFFSET (clamped at 0). Adjust this
  # once, right before cutting the first main release, so that release
  # comes out as v1.0 -- afterwards leave it alone forever (N must keep
  # increasing). play-publish.yml carries a copy that must be kept in sync.
  # See README "Versioning".
  VERSION_NAME_OFFSET: 70

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Runs on pull requests too (the build/release job below does not), so
  # broken code is caught before it ever lands on main/test.
  validate:
    name: Lint & unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Android Lint and unit tests
        run: ./gradlew lintProdRelease testProdReleaseUnitTest --no-daemon

      - name: Upload lint/test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: validation-reports
          path: app/build/reports/
          if-no-files-found: ignore

  build:
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install icon badge dependencies
        run: pip install pillow

      - name: Resolve build variant for this branch
        id: variant
        run: |
          # User-facing version "1.N" (see the VERSION_NAME_OFFSET comment
          # at the top of this file). versionCode stays the raw run_number.
          minor=$(( ${{ github.run_number }} - VERSION_NAME_OFFSET ))
          if [ "$minor" -lt 0 ]; then minor=0; fi
          version_name="1.$minor"
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "flavor=Prod" >> "$GITHUB_OUTPUT"
            echo "flavor_lower=prod" >> "$GITHUB_OUTPUT"
            echo "tag=v$version_name" >> "$GITHUB_OUTPUT"
            echo "release_name=Finwatch v$version_name" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref }}" = "refs/heads/test" ]; then
            echo "flavor=Beta" >> "$GITHUB_OUTPUT"
            echo "flavor_lower=beta" >> "$GITHUB_OUTPUT"
            echo "tag=v$version_name-test" >> "$GITHUB_OUTPUT"
            echo "release_name=Finwatch beta v$version_name" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "Unsupported branch: ${{ github.ref }}" >&2
            exit 1
          fi

      - name: Stamp BETA badge on launcher icon
        if: steps.variant.outputs.flavor_lower == 'beta'
        run: python3 scripts/badge_launcher_icon.py

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Decodes the real release keystore from repo secrets when configured.
      # Without the secrets this step is a no-op and Gradle falls back to the
      # committed debug keystore (see app/build.gradle.kts), so forks and
      # secretless runs keep producing installable builds.
      #
      # Required secrets for real release signing:
      #   RELEASE_KEYSTORE_BASE64   -- base64 of the .jks/.keystore file
      #   RELEASE_KEYSTORE_PASSWORD -- keystore password
      #   RELEASE_KEY_ALIAS         -- key alias inside the keystore
      #   RELEASE_KEY_PASSWORD      -- key password
      - name: Prepare release keystore from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "RELEASE_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "Release signing: using keystore from secrets."
          else
            echo "Release signing: RELEASE_KEYSTORE_BASE64 not set, falling back to debug signing."
          fi

      - name: Build ${{ steps.variant.outputs.flavor }} release APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assemble${{ steps.variant.outputs.flavor }}Release -PappVersionCode=${{ github.run_number }} -PversionNameOffset=$VERSION_NAME_OFFSET --no-daemon

      # Google Play only accepts App Bundles -- built alongside the APK
      # (prod only) so every main build has a Play-uploadable artifact.
      # With debug fallback signing the AAB is not accepted by Play;
      # configure the RELEASE_* secrets above for a real one.
      - name: Build Prod release AAB (Play App Bundle)
        if: steps.variant.outputs.flavor_lower == 'prod'
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew bundleProdRelease -PappVersionCode=${{ github.run_number }} -PversionNameOffset=$VERSION_NAME_OFFSET --no-daemon

      - name: Locate and rename APK
        id: apk
        run: |
          built_apk=$(find app/build/outputs/apk/${{ steps.variant.outputs.flavor_lower }}/release -name '*.apk' | head -n1)
          if [ -z "$built_apk" ]; then
            echo "No APK produced" >&2
            exit 1
          fi
          if [ "${{ steps.variant.outputs.flavor_lower }}" = "beta" ]; then
            final_name="finwatch-v${{ steps.variant.outputs.version_name }}-test.apk"
          else
            final_name="finwatch-v${{ steps.variant.outputs.version_name }}.apk"
          fi
          final_path="$(dirname "$built_apk")/$final_name"
          mv "$built_apk" "$final_path"
          echo "path=$final_path" >> "$GITHUB_OUTPUT"

      - name: Locate and rename AAB
        id: aab
        if: steps.variant.outputs.flavor_lower == 'prod'
        run: |
          built_aab=$(find app/build/outputs/bundle -name '*.aab' | head -n1)
          if [ -z "$built_aab" ]; then
            echo "No AAB produced" >&2
            exit 1
          fi
          final_path="$(dirname "$built_aab")/finwatch-v${{ steps.variant.outputs.version_name }}.aab"
          mv "$built_aab" "$final_path"
          echo "path=$final_path" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.variant.outputs.flavor_lower }}-apk
          path: ${{ steps.apk.outputs.path }}

      - name: Upload AAB artifact
        if: steps.variant.outputs.flavor_lower == 'prod'
        uses: actions/upload-artifact@v4
        with:
          name: prod-aab
          path: ${{ steps.aab.outputs.path }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.variant.outputs.tag }}
          name: ${{ steps.variant.outputs.release_name }}
          prerelease: ${{ steps.variant.outputs.prerelease }}
          files: |
            ${{ steps.apk.outputs.path }}
            ${{ steps.aab.outputs.path }}
